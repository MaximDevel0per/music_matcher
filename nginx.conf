server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Audio-Uploads sind groß. nginx erlaubt standardmäßig nur 1 MB und würde
    # sonst mit 413 abbrechen, bevor die Anfrage das Backend überhaupt erreicht.
    # Sollte zu MAX_UPLOAD_MB im Backend passen (dort 60) — etwas Luft für den
    # multipart-Overhead ist eingerechnet.
    client_max_body_size 80m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Das Backend. Der abschließende Schrägstrich in proxy_pass schneidet das
    # /api-Präfix ab: /api/auth/login  ->  http://backend:3000/auth/login
    location /api/ {
        proxy_pass http://backend:3000/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Große Uploads nicht erst komplett zwischenspeichern, sondern
        # durchreichen — spart Plattenplatz und RAM auf dem Pi.
        proxy_request_buffering off;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }

    # Gehashte Dateinamen (index-a1b2c3.js) dürfen dauerhaft im Cache bleiben.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-Page-App: unbekannte Pfade liefern die index.html aus,
    # damit ein Reload auf einer Unterseite nicht in einem 404 endet.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
